name: Locate MSVC 14.28 patch

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/msvc-version-sweep.yml

jobs:
  inspect:
    strategy:
      fail-fast: false
      matrix:
        include:
          - release: 16.9.10
            url: https://download.visualstudio.microsoft.com/download/pr/3daa9785-bfd4-4cb1-bdc3-6d8d52159671/b24f75623e522f42ef6c5668bdb1683f7af3cfca48cddef77d0ead38207de802/vs_BuildTools.exe
          - release: 16.9.12
            url: https://download.visualstudio.microsoft.com/download/pr/dcb0a070-a0c3-4fda-a07e-b00b4f777924/0f7200f381b269441a113ba7bf310c4dd291ffcc9e62d0a934dc9343add96a98/vs_BuildTools.exe
          - release: 16.9.14
            url: https://download.visualstudio.microsoft.com/download/pr/33439e30-02ff-417f-b6ef-927e424e84c9/cff2eb1a766df58fa77a9a89e7fc1765cc419c3175cd26bb0c97806649ab0981/vs_BuildTools.exe
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Install historical Build Tools ${{ matrix.release }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bootstrapper = Join-Path $env:RUNNER_TEMP 'vs_BuildTools.exe'
          Invoke-WebRequest -Uri '${{ matrix.url }}' -OutFile $bootstrapper
          $arguments = @(
            '--quiet', '--wait', '--norestart', '--nocache',
            '--installPath', 'C:\VS2019BuildTools',
            '--add', 'Microsoft.VisualStudio.Workload.VCTools',
            '--add', 'Microsoft.VisualStudio.Component.VC.CoreBuildTools',
            '--add', 'Microsoft.VisualStudio.Component.VC.Tools.x86.x64',
            '--add', 'Microsoft.VisualStudio.Component.Windows10SDK.19041',
            '--add', 'Microsoft.VisualStudio.Component.VC.14.28.16.9.x86.x64'
          )
          $process = Start-Process -FilePath $bootstrapper -ArgumentList $arguments -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer exited $($process.ExitCode)" }
          if (-not (Test-Path 'C:\VS2019BuildTools\VC\Auxiliary\Build\vcvarsall.bat')) {
            throw 'vcvarsall.bat missing after install'
          }

      - name: Record x86 compiler and linker versions
        shell: cmd
        run: |
          call C:\VS2019BuildTools\VC\Auxiliary\Build\vcvarsall.bat amd64_x86 -vcvars_ver=14.28
          if errorlevel 1 exit /b 1
          cl /Bv > version.txt 2>&1
          findstr /C:"Compiler Version" /C:"c2.dll" /C:"link.exe" version.txt

      - name: Upload version report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: msvc-${{ matrix.release }}-version
          path: version.txt
          if-no-files-found: warn
