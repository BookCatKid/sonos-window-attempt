name: MSVC 14.28 x86 probe

on:
  workflow_dispatch:
    inputs:
      sweep_flags:
        description: Run the full compiler settings matrix
        type: boolean
        default: false
      focused_probe:
        description: Compile member ABI and owner parameter experiments
        type: boolean
        default: false
      include_data_probe:
        description: Also rebuild packed non-executable data during a focused probe
        type: boolean
        default: false
      build_experiments:
        description: Run real LINK layout and upstream C library experiments
        type: boolean
        default: false
      persistent_worker:
        description: Use a registered Windows x64 worker labelled sonos-msvc142
        type: boolean
        default: false
      bulk_matrix:
        description: Matrix JSON for bulk-part slicing, e.g. {"slice":[0,1,2,3],"mod":[4]}
        type: string
        default: '{"slice":[0],"mod":[1]}'
      link_dll:
        description: Also link the bulk objects into a recovered DLL image
        type: boolean
        default: false
      bulk_flags:
        description: Optional cl flag line for the bulk build (SONOS_BULK_FLAGS)
        type: string
        default: ''
      bulk_suffix:
        description: Optional suffix appended to bulk object names
        type: string
        default: ''
  push:
    branches: [main]
    paths:
      - src/**
      - tools/build_probe.cmd
      - tools/build_flag_sweep.cmd
      - tools/msvc_flag_sweep.json
      - .github/workflows/msvc-142-probe.yml

jobs:
  compile:
    runs-on: ${{ github.event.inputs.persistent_worker == 'true' && fromJSON('["self-hosted","Windows","X64","sonos-msvc142"]') || fromJSON('["windows-2022"]') }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(github.event.inputs.bulk_matrix || '{"slice":[0],"mod":[1]}') }}
    steps:
      - uses: actions/checkout@v4

      - name: Restore pinned compiler binaries for focused probes
        id: focused_compiler
        uses: actions/cache@v4
        with:
          path: C:\VS2019BuildTools\VC\Tools\MSVC\14.28.29910\bin\HostX64
          key: windows-2022-msvc-19.28.29919-hostx64-v1

      - name: Install Visual Studio 2019 16.9.10 Build Tools
        if: (github.event.inputs.focused_probe != 'true' && github.event.inputs.build_experiments != 'true') || steps.focused_compiler.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (Test-Path 'C:\VS2019BuildTools\VC\Auxiliary\Build\vcvarsall.bat') {
            Write-Output 'Using existing Build Tools installation; experiments verify the compiler version.'
            exit 0
          }
          if (Test-Path 'C:\VS2019BuildTools') {
            # The compiler-binary cache restores into the install root, and the
            # VS installer refuses to install into a nonempty directory.
            Write-Output 'Moving cache-restored compiler tree aside so the installer accepts the install path'
            if (Test-Path 'C:\VS2019BuildTools.cachedbin') {
              Remove-Item 'C:\VS2019BuildTools.cachedbin' -Recurse -Force
            }
            Move-Item 'C:\VS2019BuildTools' 'C:\VS2019BuildTools.cachedbin'
          }
          # 16.9.10 BuildTools link from Microsoft's VS 2019 release history.
          $uri = 'https://download.visualstudio.microsoft.com/download/pr/3daa9785-bfd4-4cb1-bdc3-6d8d52159671/b24f75623e522f42ef6c5668bdb1683f7af3cfca48cddef77d0ead38207de802/vs_BuildTools.exe'
          $bootstrapper = Join-Path $env:RUNNER_TEMP 'vs_BuildTools_16_9_10.exe'
          Invoke-WebRequest -Uri $uri -OutFile $bootstrapper
          $arguments = @(
            '--quiet', '--wait', '--norestart', '--nocache',
            '--installPath', 'C:\VS2019BuildTools',
            '--add', 'Microsoft.VisualStudio.Workload.VCTools',
            '--add', 'Microsoft.VisualStudio.Component.VC.CoreBuildTools',
            '--add', 'Microsoft.VisualStudio.Component.VC.Tools.x86.x64',
            '--add', 'Microsoft.VisualStudio.Component.Windows10SDK.19041',
            '--add', 'Microsoft.VisualStudio.Component.VC.14.28.16.9.x86.x64'
          )
          $process = Start-Process -FilePath $bootstrapper -ArgumentList $arguments -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            Write-Output "::warning::Pinned 16.9.10 installer exited with $($process.ExitCode); retrying with the latest VS 2019 channel bootstrapper"
            Invoke-WebRequest -Uri 'https://aka.ms/vs/16/release/vs_buildtools.exe' -OutFile $bootstrapper
            $process = Start-Process -FilePath $bootstrapper -ArgumentList $arguments -Wait -PassThru
          }
          if ($process.ExitCode -ne 0) {
            Get-ChildItem $env:TEMP -Filter 'dd_*.log' -ErrorAction SilentlyContinue |
              Sort-Object LastWriteTime -Descending | Select-Object -First 4 |
              ForEach-Object {
                Write-Output "::group::$($_.Name)"
                Get-Content $_.FullName -Tail 60 -ErrorAction SilentlyContinue
                Write-Output '::endgroup::'
              }
            throw "VS 2019 installer exited with code $($process.ExitCode)"
          }
          $vcvars = 'C:\VS2019BuildTools\VC\Auxiliary\Build\vcvarsall.bat'
          if (-not (Test-Path $vcvars)) {
            $rootExists = Test-Path 'C:\VS2019BuildTools'
            Write-Output "::error::vcvarsall.bat missing at $vcvars; install root exists: $rootExists"
            if ($rootExists) {
              Get-ChildItem 'C:\VS2019BuildTools' -Force | ForEach-Object {
                Write-Output "::notice::Install root contains $($_.Name)"
              }
              Get-ChildItem 'C:\VS2019BuildTools' -Recurse -Filter vcvarsall.bat -ErrorAction SilentlyContinue | ForEach-Object {
                Write-Output "::notice::Found vcvarsall at $($_.FullName)"
              }
            }
            $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
            if (Test-Path $vswhere) {
              & $vswhere -products Microsoft.VisualStudio.Product.BuildTools -format json |
                ForEach-Object { Write-Output "::notice::vswhere $_" }
            }
            throw 'Requested MSVC toolset did not install at the expected path'
          }

      - name: Inventory available CRT sources
        shell: pwsh
        run: |
          $roots = @(
            'C:\VS2019BuildTools\VC\Tools\MSVC\14.28.29910\crt\src',
            'C:\VS2019BuildTools\VC\crt\src',
            "${env:ProgramFiles(x86)}\Windows Kits\10\Source"
          )
          foreach ($r in $roots) {
            if (Test-Path $r) {
              Write-Output "CRT-SRC $r"
              Get-ChildItem $r -Directory -ErrorAction SilentlyContinue |
                ForEach-Object { Write-Output "  DIR $($_.Name)" }
            } else { Write-Output "MISSING $r" }
          }

      - name: Compile C++ candidates for x86
        if: github.event.inputs.build_experiments != 'true'
        env:
          SONOS_SWEEP_FLAGS: ${{ github.event.inputs.sweep_flags == 'true' && '1' || '0' }}
          SONOS_INCLUDE_DATA_PROBE: ${{ github.event.inputs.include_data_probe == 'true' && '1' || '0' }}
          SONOS_FOCUSED_PROBE: ${{ github.event.inputs.focused_probe == 'true' && '1' || '0' }}
          SONOS_PART_MOD: ${{ matrix.mod }}
          SONOS_PART_SLICE: ${{ matrix.slice }}
          SONOS_BULK_FLAGS: ${{ github.event.inputs.bulk_flags }}
          SONOS_BULK_SUFFIX: ${{ github.event.inputs.bulk_suffix }}
        shell: cmd
        run: |
          if "%SONOS_FOCUSED_PROBE%"=="1" (call tools\build_focused_probe.cmd) else (call tools\build_probe.cmd)
          if errorlevel 1 exit /b 1

      - name: Link recovered DLL image
        if: github.event.inputs.link_dll == 'true' && matrix.slice == 0
        shell: cmd
        run: |
          call C:\VS2019BuildTools\VC\Auxiliary\Build\vcvarsall.bat amd64_x86 -vcvars_ver=14.28 >> out\setup.log 2>&1
          call tools\link_bulk.cmd

      - name: Package CRT static libraries
        if: github.event.inputs.link_dll == 'true' && matrix.slice == 0
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out\crtlibs | Out-Null
          $dirs = @('C:\VS2019BuildTools\VC\Tools\MSVC\14.28.29910\lib\x86')
          $kitRoot = "${env:ProgramFiles(x86)}\Windows Kits\10\Lib"
          if (Test-Path $kitRoot) {
            $dirs += Get-ChildItem $kitRoot -Directory | ForEach-Object { Join-Path $_.FullName 'ucrt\x86' } | Where-Object { Test-Path $_ }
          }
          foreach ($dir in $dirs) {
            foreach ($lib in Get-ChildItem $dir -Filter *.lib) {
              Copy-Item $lib.FullName -Destination (Join-Path 'out\crtlibs' ($lib.BaseName + '-' + [math]::Abs(($dir).GetHashCode()) + '.lib'))
            }
            Write-Output "copied $dir"
          }
          Get-ChildItem out\crtlibs | ForEach-Object { Write-Output $_.Name }

      - name: Compile genuine linker and library experiments
        if: github.event.inputs.build_experiments == 'true'
        shell: cmd
        run: |
          if exist C:\VS2019BuildTools\VC\Auxiliary\Build\vcvarsall.bat (
            call C:\VS2019BuildTools\VC\Auxiliary\Build\vcvarsall.bat amd64_x86 -vcvars_ver=14.28
          ) else (
            for /f "usebackq tokens=*" %%I in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath`) do call "%%I\VC\Auxiliary\Build\vcvarsall.bat" amd64_x86
            set "SONOS_EXPERIMENT_HEADER_PROFILE=hosted-current-sdk-with-pinned-compiler"
          )
          if errorlevel 1 exit /b 1
          set "PATH=C:\VS2019BuildTools\VC\Tools\MSVC\14.28.29910\bin\HostX64\x86;%PATH%"
          python tools\run_build_experiments.py layout --output out\layout
          if errorlevel 1 exit /b 1
          python tools\run_build_experiments.py libraries --output out\libraries
          if errorlevel 1 exit /b 1

      - name: Compare on persistent Windows worker
        if: github.event.inputs.persistent_worker == 'true'
        shell: cmd
        run: |
          python -m pip install capstone==5.0.9
          if errorlevel 1 exit /b 1
          if "${{ github.event.inputs.build_experiments }}"=="true" (
            python tools\run_worker_matching.py --evidence-root C:\SonosRecovery\evidence --objects-root out\libraries --output out\matching
          ) else (
            python tools\run_worker_matching.py --evidence-root C:\SonosRecovery\evidence --member-objects-root out --output out\matching
          )
          if errorlevel 1 exit /b 1

      - name: Upload compiler outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: msvc-14-28-x86-objects-${{ matrix.slice }}
          path: |
            out/*.obj
            out/*.dll
            out/*.map
            out/*.pdb
            out/*.cod
            out/toolchain.txt
            out/*.log
            out/layout/**
            out/libraries/**
            out/matching/**
            out/crtlibs/**
          if-no-files-found: warn

